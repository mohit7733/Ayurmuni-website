# Nginx site config for a VPS. Copy dist/ to /var/www/ayurmuni, then place this in
# /etc/nginx/sites-available/ayurmuni and symlink it into sites-enabled.
# Use certbot (`sudo certbot --nginx -d your-domain.com`) to add HTTPS; camera/mic
# access for video consultations only works over HTTPS.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    root /var/www/ayurmuni;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # Hashed build files never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must not be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
